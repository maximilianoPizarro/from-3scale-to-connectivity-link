# Showroom Lab Guide Configuration
showroom:
  enabled: true
  namespace: showroom
  name: showroom

  # Lab guide Git repository
  content:
    repoUrl: "https://github.com/maximilianoPizarro/from-3scale-to-connectivity-link.git"
    repoRef: "main"
    antoraPlaybook: "showroom/site.yml"
    image: "quay.io/rhpds/showroom-content:v1.4.3"

  # Nookbag bundle (Zero Touch UI / tabs)
  nookbag:
    enabled: true
    bundleUrl: "https://github.com/rhpds/nookbag/releases/download/nookbag-v0.5.1/nookbag-v0.5.1.zip"

  proxy:
    image: "quay.io/rhpds/traefik:v3.7.9"

  gitCloner:
    image: "quay.io/rhpds/git-cloner:v1.1.5"

  antora:
    image: "quay.io/rhpds/antora:v1.3.0"

  # Terminal configuration (Kafka-day roadshow template)
  terminal:
    enabled: true
    image: "quay.io/rhpds/openshift-showroom-terminal-ocp:latest"
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

# Injected by parent chart
deployer:
  domain: ""

userCount: 30

# Used by userdata ConfigMap
demo:
  namespace: ""
  appName: ""
