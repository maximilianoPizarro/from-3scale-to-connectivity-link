---
type: showroom

default_width: 30
persist_url_state: true

view_switcher:
  enabled: true
  default_mode: split

tabs:
  # RHDP nookbag: path+port loads the in-cluster terminal.
  # Traefik maps /terminal (no arg) -> workshop-terminal.html, then ?arg=<user> -> ttyd.
  - name: Terminal
    path: /terminal
    port: 443

  - name: OCP Console
    url: 'https://console-openshift-console.${DOMAIN}'

  - name: 3scale Admin
    url: 'https://3scale-admin.${DOMAIN}'

  - name: Migration Toolkit
    url: 'https://migration-toolkit.${DOMAIN}'

  - name: APIShift
    url: 'https://gateforge-gateforge.${DOMAIN}'

  # Backstage OIDC often fails inside an iframe (redirect chain / Keycloak framing).
  - name: Developer Hub
    url: 'https://backstage-developer-hub-developer-hub.${DOMAIN}'

  - name: Keycloak
    url: 'https://rhbk.${DOMAIN}'
